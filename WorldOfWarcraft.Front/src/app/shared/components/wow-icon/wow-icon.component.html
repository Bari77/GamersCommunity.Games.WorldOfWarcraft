<!-- Blizzard packs the group-finder role glyphs in a UI sprite sheet the icon CDN does not
     serve, so the shield, cross and sword players read at a glance are redrawn here. -->
@if (glyph(); as role) {
    <svg
        class="wow-role"
        [attr.data-role]="role"
        [attr.width]="size()"
        [attr.height]="size()"
        viewBox="0 0 24 24"
        role="img"
        [attr.aria-label]="label()"
    >
        <title>{{ label() }}</title>
        <rect class="wow-role__plate" x="0.5" y="0.5" width="23" height="23" rx="4" />
        @switch (role) {
            @case ("tank") {
                <path class="wow-role__glyph" d="M12 3.6 5.6 6.2v5.4c0 3.9 2.6 7.2 6.4 8.5 3.8-1.3 6.4-4.6 6.4-8.5V6.2z" />
            }
            @case ("healer") {
                <path class="wow-role__glyph" d="M10 4.5h4v5.5h5.5v4H14v5.5h-4V14H4.5v-4H10z" />
            }
            @case ("dps") {
                <path class="wow-role__glyph" d="M12 3.2l2.4 4.6v6.4H9.6V7.8z" />
                <path class="wow-role__glyph" d="M6.6 14.2h10.8v2.2H6.6z" />
                <path class="wow-role__glyph" d="M10.9 16.4h2.2v3.1h-2.2z" />
                <circle class="wow-role__glyph" cx="12" cy="20.4" r="1.5" />
            }
        }
    </svg>
} @else if (src(); as url) {
    @if (!failed()) {
        <img
            class="wow-icon"
            [src]="url"
            [alt]="label()"
            [title]="label()"
            [style.width.px]="size()"
            [style.height.px]="size()"
            loading="lazy"
            (error)="failed.set(true)"
        />
    }
}
