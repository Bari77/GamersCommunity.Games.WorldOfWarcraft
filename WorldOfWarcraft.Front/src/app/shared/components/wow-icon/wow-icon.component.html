<!-- Blizzard packs the group-finder role glyphs in a UI sprite sheet the icon CDN does not
     serve, so the shield, cross and sword players read at a glance are redrawn here. Faction
     crests are drawn the same way: they must stay sharp at combo size. -->
@if (roleGlyph(); as role) {
    <svg
        class="wow-glyph"
        data-kind="role"
        [attr.data-slug]="role"
        [attr.width]="size()"
        [attr.height]="size()"
        viewBox="0 0 24 24"
        [attr.role]="label() ? 'img' : null"
        [attr.aria-hidden]="label() ? null : 'true'"
        [attr.aria-label]="label() || null"
    >
        @if (label()) {
            <title>{{ label() }}</title>
        }
        <rect class="wow-glyph__plate" x="0.5" y="0.5" width="23" height="23" rx="4" />
        @switch (role) {
            @case ("tank") {
                <path class="wow-glyph__mark" d="M12 3.6 5.6 6.2v5.4c0 3.9 2.6 7.2 6.4 8.5 3.8-1.3 6.4-4.6 6.4-8.5V6.2z" />
            }
            @case ("healer") {
                <path class="wow-glyph__mark" d="M10 4.5h4v5.5h5.5v4H14v5.5h-4V14H4.5v-4H10z" />
            }
            @case ("dps") {
                <path class="wow-glyph__mark" d="M12 3.2l2.4 4.6v6.4H9.6V7.8z" />
                <path class="wow-glyph__mark" d="M6.6 14.2h10.8v2.2H6.6z" />
                <path class="wow-glyph__mark" d="M10.9 16.4h2.2v3.1h-2.2z" />
                <circle class="wow-glyph__mark" cx="12" cy="20.4" r="1.5" />
            }
        }
    </svg>
} @else if (factionGlyph(); as faction) {
    <svg
        class="wow-glyph"
        data-kind="faction"
        [attr.data-slug]="faction"
        [attr.width]="size()"
        [attr.height]="size()"
        viewBox="0 0 24 24"
        [attr.role]="label() ? 'img' : null"
        [attr.aria-hidden]="label() ? null : 'true'"
        [attr.aria-label]="label() || null"
    >
        @if (label()) {
            <title>{{ label() }}</title>
        }
        <rect class="wow-glyph__plate" x="0.5" y="0.5" width="23" height="23" rx="4" />
        @switch (faction) {
            @case ("alliance") {
                <path
                    class="wow-glyph__mark"
                    d="M12 3.8 18.4 7v5.1c0 3.7-2.5 6.8-6.4 8.1C8.1 18.9 5.6 15.8 5.6 12.1V7z"
                />
                <path class="wow-glyph__cut" d="M12 7.4 14.9 16h-1.7l.4-1.4h-3.2L10.8 16H9.1z" />
            }
            @case ("horde") {
                <path
                    class="wow-glyph__mark"
                    d="M12 4.2A7.8 7.8 0 1 1 4.2 12 7.8 7.8 0 0 1 12 4.2zm0 2.2A5.6 5.6 0 1 0 17.6 12 5.6 5.6 0 0 0 12 6.4z"
                />
                <path class="wow-glyph__mark" d="M9.2 8.2h5.6L13.6 12l2.4 4.2-3.2-1.5L12 18l-.8-3.3-3.2 1.5L10.4 12z" />
            }
        }
    </svg>
} @else if (src(); as url) {
    @if (!failed()) {
        <img
            class="wow-icon"
            [src]="url"
            [alt]="label()"
            [title]="label()"
            [style.width.px]="size()"
            [style.height.px]="size()"
            loading="lazy"
            (error)="failed.set(true)"
        />
    }
}
