<ul class="latest-characters">
    @for (character of characters(); track character.publicId) {
        <li>
            <wow-entity-row
                [link]="['/world-of-warcraft/players', character.playerPublicId]"
                [accent]="character.color"
                [name]="character.pseudo"
                [subtitle]="subtitle(character)"
                [subtitleIcons]="subtitleIcons(character)"
                [subtitleMuted]="!character.className"
                [badge]="character.main ? mainLabel : null"
                [level]="character.level"
                [levelLabel]="levelLabel"
                [facts]="facts(character)"
            >
                <wow-icon
                    rowVisual
                    class="latest-characters__emblem"
                    kind="class"
                    [slug]="character.className"
                    [label]="character.className | gameTerm"
                    [size]="34"
                />
            </wow-entity-row>
        </li>
    } @empty {
        <li class="latest-characters__empty" i18n="@@wow.home.characters.empty">No characters yet.</li>
    }
</ul>
