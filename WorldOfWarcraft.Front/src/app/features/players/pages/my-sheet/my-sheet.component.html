<section class="my-sheet">
    @if (loading()) {
        <header class="my-sheet__hero" aria-busy="true">
            <div class="my-sheet__hero-row">
                <gc-skeleton width="3rem" height="3rem" radius="0.6rem" />
                <div class="my-sheet__hero-text">
                    <gc-skeleton width="5rem" height="0.65rem" />
                    <gc-skeleton width="9rem" height="1rem" />
                </div>
            </div>
            <div class="my-sheet__hero-row">
                <gc-skeleton width="3.5rem" height="3.5rem" shape="circle" />
                <div class="my-sheet__hero-text">
                    <gc-skeleton width="11rem" height="1.5rem" />
                    <gc-skeleton width="8rem" height="0.85rem" />
                </div>
            </div>
        </header>
    } @else if (needsLogin()) {
        <p i18n="@@wow.sheet.loginRequired">Log in on GamersCommunity to open your WoW player sheet.</p>
        <a href="/users/login" nbButton status="primary" i18n="@@wow.sheet.login">Log in</a>
    }
</section>
