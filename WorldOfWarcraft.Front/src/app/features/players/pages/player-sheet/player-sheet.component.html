<section class="player-sheet gc-enter">
    @if (sheet.value(); as player) {
        <wow-player-hero [player]="player" />

        @if (saveFailed()) {
            <p class="player-sheet__error" role="alert" i18n="@@wow.player.layout.saveFailed">
                Your layout could not be saved. Please try again.
            </p>
        }

        <gc-widget-workspace
            [workspace]="workspace()"
            [catalog]="catalog"
            [canEdit]="isOwner()"
            [saving]="saving()"
            [columns]="columns"
            [rowHeight]="rowHeight"
            [(editing)]="editing"
            navLabel="Profile pages"
            i18n-navLabel="@@wow.player.nav"
            addPageLabel="New page"
            i18n-addPageLabel="@@wow.player.page.add"
            removePageLabel="Delete page"
            i18n-removePageLabel="@@wow.player.page.remove"
            moveUpLabel="Move up"
            i18n-moveUpLabel="@@wow.player.page.moveUp"
            moveDownLabel="Move down"
            i18n-moveDownLabel="@@wow.player.page.moveDown"
            addWidgetLabel="Add a widget"
            i18n-addWidgetLabel="@@wow.player.widget.add"
            editLabel="Edit"
            i18n-editLabel="@@wow.player.layout.edit"
            cancelLabel="Cancel"
            i18n-cancelLabel="@@wow.player.layout.cancel"
            saveLabel="Save"
            i18n-saveLabel="@@wow.player.layout.save"
            emptyPageLabel="This page has no widget yet."
            i18n-emptyPageLabel="@@wow.player.page.empty"
            hintLabel="Drag a widget by its header to move it, or grab its bottom-right corner to resize it."
            i18n-hintLabel="@@wow.player.layout.hint"
            newPageTitle="New page"
            i18n-newPageTitle="@@wow.player.page.add"
            settingsLabel="Configure this widget"
            i18n-settingsLabel="@@wow.player.widget.settings"
            removeWidgetLabel="Remove widget"
            i18n-removeWidgetLabel="@@wow.player.widget.remove"
            widgetTitleLabel="Widget title"
            i18n-widgetTitleLabel="@@wow.player.widget.title"
            widgetTitleHint="Leave empty to drop the header."
            i18n-widgetTitleHint="@@wow.player.widget.title.hint"
            doneLabel="Done"
            i18n-doneLabel="@@wow.player.widget.done"
            (save)="onSave($event)"
        >
            <wow-widget-template-host
                [player]="player"
                [isOwner]="isOwner()"
                [editing]="editing()"
                [linksWidget]="linksWidget"
                (charactersChanged)="onCharactersChanged()"
            />
        </gc-widget-workspace>
    } @else if (sheet.error()) {
        <p i18n="@@wow.player.notFound">WoW player sheet not found.</p>
    } @else {
        <header class="player-hero player-hero--skeleton" aria-busy="true">
            <div class="player-hero__game">
                <gc-skeleton width="3rem" height="3rem" radius="0.6rem" />
                <div class="player-hero__game-text">
                    <gc-skeleton width="5rem" height="0.65rem" />
                    <gc-skeleton width="9rem" height="1rem" />
                </div>
            </div>
            <div class="player-hero__identity">
                <gc-skeleton width="3.5rem" height="3.5rem" shape="circle" />
                <div class="player-hero__who">
                    <gc-skeleton width="11rem" height="1.5rem" />
                    <gc-skeleton width="8rem" height="0.85rem" />
                </div>
            </div>
        </header>

        <div class="player-sheet__workspace-skeleton" aria-busy="true">
            <gc-skeleton width="12rem" height="2rem" radius="0.25rem" />
            <gc-skeleton width="100%" height="18rem" radius="0.75rem" />
        </div>
    }
</section>
