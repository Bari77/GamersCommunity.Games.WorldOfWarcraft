@let player = sheet();

@if (editing()) {
    <div class="stats__form">
        <div class="stats__field">
            <label for="player-stats-mounts" i18n="@@wow.player.mounts">Mounts</label>
            <input
                id="player-stats-mounts"
                nbInput
                fullWidth
                type="number"
                min="0"
                max="2000"
                [ngModel]="mounts()"
                (ngModelChange)="mounts.set($event)"
                [ngModelOptions]="{ standalone: true }"
            />
        </div>

        <div class="stats__field">
            <label for="player-stats-points" i18n="@@wow.player.successPoints">Achievement points</label>
            <input
                id="player-stats-points"
                nbInput
                fullWidth
                type="number"
                min="0"
                max="200000"
                [ngModel]="points()"
                (ngModelChange)="points.set($event)"
                [ngModelOptions]="{ standalone: true }"
            />
            <p class="stats__hint" i18n="@@wow.player.successPoints.hint">Leave empty to hide the line.</p>
        </div>

        <div class="stats__actions">
            <button nbButton ghost size="small" status="basic" (click)="editing.set(false)">
                <span i18n="@@wow.player.presentation.cancel">Cancel</span>
            </button>
            <button nbButton size="small" status="primary" [disabled]="saving()" (click)="submit()">
                <span i18n="@@wow.player.presentation.save">Save</span>
            </button>
        </div>
    </div>
} @else {
    <ul class="stats__list">
        <li>
            <span i18n="@@wow.player.characters">Characters</span>
            <strong>{{ player.characterCount }}</strong>
        </li>
        <li>
            <span i18n="@@wow.player.mounts">Mounts</span>
            <strong>{{ player.nbMount }}</strong>
        </li>
        @if (player.successPoints !== null) {
            <li>
                <span i18n="@@wow.player.successPoints">Achievement points</span>
                <strong>{{ player.successPoints }}</strong>
            </li>
        }
    </ul>

    @if (canEdit()) {
        <button class="stats__edit" nbButton ghost size="small" status="basic" (click)="open()">
            <nb-icon icon="edit-2-outline"></nb-icon>
            <span i18n="@@wow.player.presentation.edit">Edit</span>
        </button>
    }
}
