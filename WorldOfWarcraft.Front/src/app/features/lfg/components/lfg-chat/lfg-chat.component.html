<gc-lfg-chat
    [title]="title()"
    [messages]="viewMessages()"
    [loading]="store.loading()"
    [loadingOlder]="store.loadingOlder()"
    [hasMore]="store.hasMore()"
    [isLive]="realtime.isLive()"
    [offlineMessage]="realtime.offlineMessage()"
    [offlineConnecting]="realtime.status() === 'connecting'"
    [composerState]="composerState()"
    [cooldownSeconds]="store.cooldownSeconds()"
    [showPosterPicker]="isRecruitment() && store.canPost()"
    [posterOptions]="posterOptions()"
    [selectedPosterId]="store.postingAs()"
    [labels]="labels"
    (send)="onSend($event)"
    (requestOlder)="onRequestOlder()"
    (selectPoster)="store.selectGuild($event)"
>
    <ng-template gcLfgChatLeading let-message>
        @if (asMessage(message.context); as raw) {
            @if (raw.isGuildAd()) {
                @if (raw.guildCrest) {
                    <wow-guild-crest class="gc-lfg-chat__bubble-crest" [crest]="raw.guildCrest" [size]="32" />
                } @else {
                    <span class="gc-lfg-chat__bubble-avatar gc-lfg-chat__bubble-avatar--fallback" aria-hidden="true">
                        {{ message.initial }}
                    </span>
                }
            } @else if (message.avatarUrl; as avatarUrl) {
                <img class="gc-lfg-chat__bubble-avatar" [src]="avatarUrl" alt="" />
            } @else {
                <span class="gc-lfg-chat__bubble-avatar gc-lfg-chat__bubble-avatar--fallback" aria-hidden="true">
                    {{ message.initial }}
                </span>
            }
        }
    </ng-template>

    <wow-create-sheet-wall gcLfgChatNeedsSheet variant="inline" [message]="sheetWallMessage" />
</gc-lfg-chat>
