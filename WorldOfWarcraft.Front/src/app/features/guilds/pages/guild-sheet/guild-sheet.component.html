<section class="guild-sheet gc-enter">
    @if (store.notFound()) {
        <nb-card>
            <nb-card-body>
                <p i18n="@@wow.guild.notFound">Guild not found.</p>
            </nb-card-body>
        </nb-card>
    } @else if (store.sheet(); as guild) {
        <wow-guild-hero [guild]="guild" [canModerate]="store.canModerate()" [(settingsOpen)]="settingsOpen" />

        @if (store.canModerate() && settingsOpen()) {
            <wow-guild-admin
                id="guild-settings"
                [sheet]="guild"
                [saving]="store.saving()"
                [errorCode]="store.errorCode()"
                (save)="onSave($event)"
                (disband)="onDisband($event)"
            />
        }

        @if (saveFailed()) {
            <p class="guild-sheet__error" role="alert" i18n="@@wow.guild.layout.saveFailed">
                Your layout could not be saved. Please try again.
            </p>
        }

        <gc-widget-workspace
            [workspace]="workspace()"
            [catalog]="catalog"
            [canEdit]="canEditLayout()"
            [saving]="store.saving()"
            [columns]="columns"
            [rowHeight]="rowHeight"
            [(editing)]="editing"
            [pageVisibilityOptions]="pageVisibilityOptions"
            pageVisibilityLabel="Who can see this page"
            i18n-pageVisibilityLabel="@@wow.guild.page.visibility"
            navLabel="Guild pages"
            i18n-navLabel="@@wow.guild.nav"
            addPageLabel="New page"
            i18n-addPageLabel="@@wow.guild.page.add"
            removePageLabel="Delete page"
            i18n-removePageLabel="@@wow.guild.page.remove"
            moveUpLabel="Move up"
            i18n-moveUpLabel="@@wow.guild.page.moveUp"
            moveDownLabel="Move down"
            i18n-moveDownLabel="@@wow.guild.page.moveDown"
            addWidgetLabel="Add a widget"
            i18n-addWidgetLabel="@@wow.guild.widget.add"
            editLabel="Edit"
            i18n-editLabel="@@wow.guild.layout.edit"
            cancelLabel="Cancel"
            i18n-cancelLabel="@@wow.guild.layout.cancel"
            saveLabel="Save"
            i18n-saveLabel="@@wow.guild.layout.save"
            emptyPageLabel="This page has no widget yet."
            i18n-emptyPageLabel="@@wow.guild.page.empty"
            hintLabel="Drag a widget by its header to move it, or grab its bottom-right corner to resize it."
            i18n-hintLabel="@@wow.guild.layout.hint"
            newPageTitle="New page"
            i18n-newPageTitle="@@wow.guild.page.add"
            settingsLabel="Configure this widget"
            i18n-settingsLabel="@@wow.guild.widget.settings"
            editDataLabel="Edit data"
            i18n-editDataLabel="@@wow.guild.widget.editData"
            removeWidgetLabel="Remove widget"
            i18n-removeWidgetLabel="@@wow.guild.widget.remove"
            widgetTitleLabel="Widget title"
            i18n-widgetTitleLabel="@@wow.guild.widget.title"
            widgetTitleHint="Leave empty to drop the header."
            i18n-widgetTitleHint="@@wow.guild.widget.title.hint"
            doneLabel="Done"
            i18n-doneLabel="@@wow.guild.widget.done"
            (save)="onSaveLayout($event)"
        >
            <wow-guild-widget-template-host
                [guild]="guild"
                [editing]="editing()"
                [savingField]="store.saving()"
                [errorCode]="store.errorCode()"
                [playerPublicId]="membership.playerPublicId()"
                [myCharacterPublicIds]="myCharacterPublicIds()"
                [busy]="store.saving()"
                [applyCandidates]="applyCandidates()"
                [applyLoading]="loadingCharacters()"
                [applySaving]="store.saving()"
                [applyErrorCode]="store.errorCode()"
                [needsSheet]="membership.needsSheet()"
                (setRank)="onSetRank($event)"
                (kick)="onKick($event)"
                (transfer)="onTransfer($event)"
                (leave)="onLeave($event)"
                (apply)="onApply($event)"
                (withdraw)="onWithdraw()"
                (rosterChanged)="onRosterChanged()"
                (saveField)="onSave($event)"
            />
        </gc-widget-workspace>

    } @else {
        <header class="guild-hero guild-hero--skeleton" aria-busy="true">
            <div class="guild-hero__game">
                <gc-skeleton width="3rem" height="3rem" radius="0.6rem" />
                <div class="guild-hero__game-text">
                    <gc-skeleton width="5rem" height="0.65rem" />
                    <gc-skeleton width="9rem" height="1rem" />
                </div>
            </div>
            <div class="guild-hero__identity">
                <gc-skeleton width="14rem" height="1.6rem" />
                <gc-skeleton width="20rem" height="0.8rem" />
            </div>
        </header>

        <div class="guild-sheet__workspace-skeleton" aria-busy="true">
            <gc-skeleton width="12rem" height="2rem" radius="0.25rem" />
            <gc-skeleton width="100%" height="18rem" radius="0.75rem" />
        </div>
    }
</section>
